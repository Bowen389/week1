name: W1 批量历史快速复核
on:
  push:
    branches: [main]
    paths: ['src/review_fast.py', '.github/workflows/review-fast.yml']
  workflow_dispatch:
    inputs:
      signal_date:
        default: '2026-10-09'
        required: true
        description: 信号周末最后交易日
permissions:
  contents: write
  actions: write
concurrency:
  group: w1-fast-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stop superseded slow review and its queued duplicate daily run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/actions/runs/38381617059/cancel || true
          gh api --method POST repos/${{ github.repository }}/actions/runs/38381613176/cancel || true
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fast read-only review
        id: review
        continue-on-error: true
        env:
          REVIEW_DATE: ${{ inputs.signal_date || '2026-10-09' }}
        run: python -m src.review_fast --date "$REVIEW_DATE"
      - name: Commit fast review reports only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/review-fast-*.json reports/review-fast-*.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record fast historical W1 review [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w1-fast-review-${{ github.run_id }}
          path: reports/review-fast-*
      - if: steps.review.outcome == 'failure'
        run: exit 1
