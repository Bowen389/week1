name: W1 单周只读复核
on:
  workflow_dispatch:
    inputs:
      signal_date:
        description: 信号周最后交易日（YYYY-MM-DD）
        default: '2026-10-09'
        required: true
  push:
    branches: [main]
    paths: ['src/review_week.py', '.github/workflows/review.yml']
permissions:
  contents: write
concurrency:
  group: w1-paper-ledger
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Review closed week without changing paper ledger
        id: review
        continue-on-error: true
        env:
          REVIEW_DATE: ${{ inputs.signal_date || '2026-10-09' }}
        run: python -m src.review_week --date "$REVIEW_DATE"
      - name: Commit review reports only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/review-*.json reports/review-*.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record read-only W1 weekly review [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w1-week-review-${{ github.run_id }}
          path: reports/review-*
          retention-days: 90
      - if: steps.review.outcome == 'failure'
        run: exit 1
